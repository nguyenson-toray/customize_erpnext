<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Door Control">
  <title>Door Control</title>
  <!-- Slate tile like the /door_control top bar logo; door with an amber "unlocked" badge. -->
  <defs>
    <linearGradient id="dcTile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1E293B"/>
      <stop offset="1" stop-color="#0F172A"/>
    </linearGradient>
  </defs>
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#dcTile)"/>

